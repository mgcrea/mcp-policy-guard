[project]
name = "mcp-policy-guard"
version = "0.5.1"
license = "MIT"
description = "Per-caller authentication and authorization for MCP servers"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.13.0",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "cryptography>=44.0.0",
    "mcp==1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_policy_guard"]
# PEP 561: without this the marker is not shipped and consumers get no type information
# from a package whose whole value is a typed contract.
artifacts = ["src/mcp_policy_guard/py.typed"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "I"]
