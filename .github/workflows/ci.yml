name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: uv-
      - run: uv sync --frozen
      - run: uv run ruff check src/

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: uv-
      - run: uv sync --frozen
      - run: uv run ruff format --check src/

  test:
    # The MCP SDK is not a dependency of this package, but the per-message principal binding
    # is written against SDK internals that differ between generations — and 1.x is the one
    # where the binding is load-bearing rather than belt-and-braces. Both are tested because
    # a change that works on one can silently blank the caller on the other.
    name: Run Tests (mcp ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    strategy:
      fail-fast: false
      matrix:
        mcp: ["1.26.0", "2.0.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: uv-
      - run: uv sync --frozen
      - run: uv run --with 'mcp==${{ matrix.mcp }}' pytest -v

  # No Docker release job: this is a library, not a service. Consuming MCP servers depend on
  # it from their own pyproject.toml and vendor it into their image at `uv sync`.
  build:
    name: Build Distribution
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
